<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="How a message flows in DevGuide Agent: you, Spring API, context, Gemini, answer. Gemini calls tools by itself: Context7, GitHub, runCode, saveLearnerNote, createDocument.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="brain" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C1D95" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bar { font-size: 12px; fill: #64748B; }
    .note { font-size: 12px; fill: #64748B; }
    .name { font-size: 14px; font-weight: 700; fill: #F1F5F9; }
    .sub { font-size: 11px; fill: #94A3B8; }
    .tname { font-size: 12px; font-weight: 600; fill: #CCFBF1; }
    .tsub { font-size: 10px; fill: #5EEAD4; }
    .pill { font-size: 10px; fill: #FDE68A; }
    .flow { stroke-dasharray: 4 8; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .halo { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.08); } }
    .tool { animation: ping 10s linear infinite; }
    .t2 { animation-delay: 2s; } .t3 { animation-delay: 4s; } .t4 { animation-delay: 6s; } .t5 { animation-delay: 8s; }
    @keyframes ping {
      0%, 18% { stroke-opacity: 1; fill-opacity: 0.22; }
      20%, 100% { stroke-opacity: 0.3; fill-opacity: 0.06; }
    }
    .backup { animation: blink 4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    .cursor { animation: caret 1s steps(1) infinite; }
    @keyframes caret { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .halo, .tool, .backup, .cursor { animation: none; }
    }
  </style>

  <rect width="960" height="400" rx="16" fill="url(#bg)"/>
  <rect width="960" height="400" rx="16" fill="url(#grid)"/>

  <!-- window bar -->
  <rect width="960" height="36" rx="16" fill="#0F172A"/>
  <rect y="20" width="960" height="16" fill="#0F172A"/>
  <circle cx="22" cy="18" r="5.5" fill="#F87171"/>
  <circle cx="40" cy="18" r="5.5" fill="#FBBF24"/>
  <circle cx="58" cy="18" r="5.5" fill="#34D399"/>
  <text class="mono bar" x="480" y="22" text-anchor="middle">~/devguide-agent — POST /api/chat</text>

  <text class="mono note" x="40" y="72">// one message → one agent loop</text>
  <rect class="cursor" x="263" y="62" width="7" height="13" fill="#64748B"/>

  <!-- main path (drawn first, the boxes cover it) -->
  <line class="flow" x1="110" y1="140" x2="870" y2="140" stroke="#67E8F9" stroke-width="2" stroke-linecap="round"/>
  <circle r="4" fill="#ECFEFF">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M110,140 L870,140"/>
  </circle>
  <circle r="3" fill="#ECFEFF" opacity="0.6">
    <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M110,140 L870,140"/>
  </circle>

  <!-- tool links from Gemini -->
  <g fill="none" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5">
    <path class="flow" d="M680,172 C680,232 110,232 110,290"/>
    <path class="flow" d="M680,172 C680,232 300,232 300,290"/>
    <path class="flow" d="M680,172 C680,232 490,232 490,290"/>
    <path class="flow" d="M680,172 L680,290"/>
    <path class="flow" d="M680,172 C680,232 870,232 870,290"/>
  </g>

  <!-- a dot visits each tool in turn -->
  <g fill="#CCFBF1">
    <circle r="3.5" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M680,172 C680,232 110,232 110,290" keyPoints="0;1;0;0" keyTimes="0;0.09;0.18;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;1;0;0" keyTimes="0;0.09;0.17;0.18;1"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M680,172 C680,232 300,232 300,290" keyPoints="0;0;1;0;0" keyTimes="0;0.2;0.29;0.38;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.2;0.37;0.38;1"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M680,172 C680,232 490,232 490,290" keyPoints="0;0;1;0;0" keyTimes="0;0.4;0.49;0.58;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.4;0.57;0.58;1"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M680,172 L680,290" keyPoints="0;0;1;0;0" keyTimes="0;0.6;0.69;0.78;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.6;0.77;0.78;1"/>
    </circle>
    <circle r="3.5" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M680,172 C680,232 870,232 870,290" keyPoints="0;0;1;0;0" keyTimes="0;0.8;0.89;0.98;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.8;0.97;0.98;1"/>
    </circle>
  </g>

  <!-- main nodes -->
  <g class="mono">
    <rect x="40" y="108" width="140" height="64" rx="10" fill="#0E7490" fill-opacity="0.18" stroke="#22D3EE" stroke-opacity="0.8"/>
    <text class="name" x="110" y="136" text-anchor="middle">&gt; you</text>
    <text class="sub" x="110" y="154" text-anchor="middle">question + JWT</text>

    <rect x="230" y="108" width="140" height="64" rx="10" fill="#4F46E5" fill-opacity="0.18" stroke="#818CF8" stroke-opacity="0.8"/>
    <text class="name" x="300" y="136" text-anchor="middle">spring api</text>
    <text class="sub" x="300" y="154" text-anchor="middle">auth · ownership</text>

    <rect x="420" y="108" width="140" height="64" rx="10" fill="#2563EB" fill-opacity="0.16" stroke="#60A5FA" stroke-opacity="0.8"/>
    <text class="name" x="490" y="136" text-anchor="middle">context</text>
    <text class="sub" x="490" y="154" text-anchor="middle">memory · RAG · notes</text>

    <circle class="halo" cx="680" cy="140" r="78" fill="url(#halo)"/>
    <rect x="610" y="108" width="140" height="64" rx="10" fill="url(#brain)" stroke="#A78BFA"/>
    <text class="name" x="680" y="136" text-anchor="middle">gemini</text>
    <text class="sub" x="680" y="154" text-anchor="middle">thinks · picks tools</text>

    <rect x="800" y="108" width="140" height="64" rx="10" fill="#059669" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.8"/>
    <text class="name" x="870" y="136" text-anchor="middle">answer</text>
    <text class="sub" x="870" y="154" text-anchor="middle">saved · cited</text>
  </g>

  <!-- backup model -->
  <g class="backup mono">
    <rect x="618" y="78" width="124" height="20" rx="10" fill="#78350F" fill-opacity="0.35" stroke="#FBBF24" stroke-opacity="0.6"/>
    <text class="pill" x="680" y="92" text-anchor="middle">↺ backup model ready</text>
  </g>

  <!-- tools -->
  <g class="mono">
    <rect class="tool" x="40" y="290" width="140" height="44" rx="8" fill="#14B8A6" stroke="#2DD4BF"/>
    <text class="tname" x="110" y="309" text-anchor="middle">context7</text>
    <text class="tsub" x="110" y="324" text-anchor="middle">live docs</text>

    <rect class="tool t2" x="230" y="290" width="140" height="44" rx="8" fill="#14B8A6" stroke="#2DD4BF"/>
    <text class="tname" x="300" y="309" text-anchor="middle">github</text>
    <text class="tsub" x="300" y="324" text-anchor="middle">read repos</text>

    <rect class="tool t3" x="420" y="290" width="140" height="44" rx="8" fill="#14B8A6" stroke="#2DD4BF"/>
    <text class="tname" x="490" y="309" text-anchor="middle">runCode()</text>
    <text class="tsub" x="490" y="324" text-anchor="middle">piston sandbox</text>

    <rect class="tool t4" x="610" y="290" width="140" height="44" rx="8" fill="#14B8A6" stroke="#2DD4BF"/>
    <text class="tname" x="680" y="309" text-anchor="middle">saveLearnerNote()</text>
    <text class="tsub" x="680" y="324" text-anchor="middle">remembers you</text>

    <rect class="tool t5" x="800" y="290" width="140" height="44" rx="8" fill="#14B8A6" stroke="#2DD4BF"/>
    <text class="tname" x="870" y="309" text-anchor="middle">createDocument()</text>
    <text class="tsub" x="870" y="324" text-anchor="middle">pdf · docx</text>
  </g>

  <text class="mono note" x="40" y="372">// gemini decides which tools to call; spring ai runs them and feeds the results back</text>
</svg>
