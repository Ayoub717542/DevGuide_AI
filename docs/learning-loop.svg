<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-label="The DevGuide Agent learning loop: learn, test with a quiz or challenge, score per concept, schedule the next review, and the tutor offers the review when it is due.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bar { font-size: 12px; fill: #64748B; }
    .note { font-size: 12px; fill: #64748B; }
    .name { font-size: 14px; font-weight: 700; fill: #F1F5F9; }
    .sub { font-size: 11px; fill: #94A3B8; }
    .code { font-size: 12px; fill: #CBD5E1; }
    .key { fill: #93C5FD; }
    .str { fill: #86EFAC; }
    .num { fill: #FCA5A5; }
    .yes { fill: #FDE68A; }
    .cmt { font-size: 11px; fill: #64748B; }
    .flow { stroke-dasharray: 4 8; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .station { animation: lit 8s linear infinite; }
    .s1 { animation-delay: 0.2s; } .s2 { animation-delay: 2s; } .s3 { animation-delay: 3.1s; }
    .s4 { animation-delay: 4.2s; } .s5 { animation-delay: 6s; }
    @keyframes lit {
      0%, 11% { fill-opacity: 0.35; stroke-opacity: 1; }
      14%, 100% { fill-opacity: 0.1; stroke-opacity: 0.45; }
    }
    .due { animation: glow 2s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.45; } }
    .cursor { animation: caret 1s steps(1) infinite; }
    @keyframes caret { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .station, .due, .cursor { animation: none; }
    }
  </style>

  <rect width="960" height="370" rx="16" fill="url(#bg)"/>
  <rect width="960" height="370" rx="16" fill="url(#grid)"/>

  <!-- window bar -->
  <rect width="960" height="36" rx="16" fill="#0F172A"/>
  <rect y="20" width="960" height="16" fill="#0F172A"/>
  <circle cx="22" cy="18" r="5.5" fill="#F87171"/>
  <circle cx="40" cy="18" r="5.5" fill="#FBBF24"/>
  <circle cx="58" cy="18" r="5.5" fill="#34D399"/>
  <text class="mono bar" x="480" y="22" text-anchor="middle">~/devguide-agent — learning loop</text>

  <text class="mono note" x="40" y="72">// learn → prove it → score → schedule → review</text>

  <!-- loop track (the stations cover it) -->
  <path id="loop" class="flow" d="M150,110 H470 A60,60 0 0 1 530,170 V240 A60,60 0 0 1 470,300 H150 A60,60 0 0 1 90,240 V170 A60,60 0 0 1 150,110 Z" fill="none" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="2"/>
  <circle r="4.5" fill="#F5F3FF">
    <animateMotion dur="8s" repeatCount="indefinite" path="M150,110 H470 A60,60 0 0 1 530,170 V240 A60,60 0 0 1 470,300 H150 A60,60 0 0 1 90,240 V170 A60,60 0 0 1 150,110 Z"/>
  </circle>
  <circle r="3" fill="#F5F3FF" opacity="0.5">
    <animateMotion dur="8s" begin="0.25s" repeatCount="indefinite" path="M150,110 H470 A60,60 0 0 1 530,170 V240 A60,60 0 0 1 470,300 H150 A60,60 0 0 1 90,240 V170 A60,60 0 0 1 150,110 Z"/>
  </circle>

  <!-- stations -->
  <g class="mono">
    <rect class="station s1" x="115" y="85" width="130" height="50" rx="10" fill="#22D3EE" stroke="#22D3EE"/>
    <text class="name" x="180" y="106" text-anchor="middle">learn</text>
    <text class="sub" x="180" y="123" text-anchor="middle">chat · notes</text>

    <rect class="station s2" x="375" y="85" width="130" height="50" rx="10" fill="#818CF8" stroke="#818CF8"/>
    <text class="name" x="440" y="106" text-anchor="middle">prove it</text>
    <text class="sub" x="440" y="123" text-anchor="middle">quiz · challenge</text>

    <rect class="station s3" x="465" y="180" width="130" height="50" rx="10" fill="#F472B6" stroke="#F472B6"/>
    <text class="name" x="530" y="201" text-anchor="middle">score</text>
    <text class="sub" x="530" y="218" text-anchor="middle">java-streams 1/3</text>

    <rect class="station s4" x="375" y="275" width="130" height="50" rx="10" fill="#FBBF24" stroke="#FBBF24"/>
    <text class="name" x="440" y="296" text-anchor="middle">schedule</text>
    <text class="sub" x="440" y="313" text-anchor="middle">1 · 2 · 4 · 8 days</text>

    <rect class="station s5" x="115" y="275" width="130" height="50" rx="10" fill="#34D399" stroke="#34D399"/>
    <text class="name" x="180" y="296" text-anchor="middle">review</text>
    <text class="sub" x="180" y="313" text-anchor="middle">"time to review!"</text>
  </g>

  <!-- terminal -->
  <g class="mono">
    <rect x="630" y="85" width="300" height="240" rx="10" fill="#020617" fill-opacity="0.7" stroke="#334155"/>
    <text class="code" x="648" y="112"><tspan fill="#34D399">$</tspan> GET /api/users/me/reviews</text>
    <text class="code" x="648" y="140">[{</text>
    <text class="code" x="664" y="160"><tspan class="key">"concept"</tspan>: <tspan class="str">"java-streams"</tspan>,</text>
    <text class="code" x="664" y="180"><tspan class="key">"lastScore"</tspan>: <tspan class="num">1</tspan>,</text>
    <text class="code" x="664" y="200"><tspan class="key">"lastTotal"</tspan>: <tspan class="num">3</tspan>,</text>
    <text class="code" x="664" y="220"><tspan class="key">"nextReview"</tspan>: <tspan class="str">"tomorrow"</tspan>,</text>
    <rect class="due" x="658" y="227" width="110" height="18" rx="4" fill="#FBBF24"/>
    <text class="code" x="664" y="240"><tspan class="key">"due"</tspan>: <tspan class="yes">true</tspan></text>
    <text class="code" x="648" y="260">}]</text>
    <text class="cmt" x="648" y="288">// 1/3      → again tomorrow</text>
    <text class="cmt" x="648" y="306">// 3/3 ×3   → in 8 days</text>
    <rect class="cursor" x="826" y="296" width="7" height="13" fill="#64748B"/>
  </g>

  <text class="mono note" x="40" y="350">// weak concepts come back fast; mastered ones wait longer each time</text>
</svg>
