spring.application.name=DevTutor
server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
app.piston.url=${PISTON_URL:http://localhost:2000}
app.ai.fallback-model=gemini-3.5-flash-lite

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.schema=classpath:schema-chat-memory.sql

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=devtutor_documents
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.initialize-schema=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.ai.mcp.client.streamable-http.connections.context7.url=https://mcp.context7.com
spring.ai.mcp.client.streamable-http.connections.context7.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.github.url=https://api.githubcopilot.com
spring.ai.mcp.client.streamable-http.connections.github.endpoint=/mcp/
spring.ai.mcp.client.request-timeout=60s
context7.api-key=${CONTEXT7_API_KEY}
github.token=${GITHUB_PUBLIC_ACCESS_TOKEN}

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo
app.oauth2.redirect-url=${OAUTH2_REDIRECT_URL:http://localhost:5173/oauth/callback}

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}



